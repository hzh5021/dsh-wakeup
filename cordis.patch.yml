# dsh-wakeup 的 bundle 补丁：把这行插件插进 profile 的花名册。
#
# 这个文件一般不用改 —— 默认值就够跑（家目录默认是 <主目录>/dsh-home）。
# 要改成自己的，写在 profile 自己的 cordis.patch.yml 里、按 id 覆盖，例如：
#
#   - id: wakeup
#     config:
#       home: D:\我的家
#       coreFiles: [README.md, 身份.md, 怎么说话.md, 错题集.md, 成长记录.md]
#       leadFile: 怎么说话.md
#       diaryDir: 日记
#       diaryDays: 3
#       memoFile: 长期记忆库.md
#       memoSections: 6
#       homeBlockFile: 家门.md
#       tailBlockFile: 收尾.md
#       capture: true
#
# 每一项是什么意思、默认值是什么，见同目录的 使用说明.md。
- insert:
    - id: wakeup
      name: dsh-wakeup